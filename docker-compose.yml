services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: broszeit
      POSTGRES_PASSWORD: broszeit
      POSTGRES_DB: broszeit
    ports:
      - "5432:5432"
    volumes:
      - broszeit_pgdata:/var/lib/postgresql/data

volumes:
  broszeit_pgdata:
